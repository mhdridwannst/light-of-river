<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html,
      body {
        background: #1c1626;
        margin: 0;
      }
    </style>
    <title>Light of River</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="missions"></div>
      <div class="bar"><i id="fill"></i></div>
      <div class="right">
        <b id="dist">0</b><span id="combo"></span><span id="cnd"></span>
      </div>
    </div>
    <div id="pop"></div>
    <button id="dash">Dash</button>
    <div id="ov">
      <h1 id="title">Light of River</h1>
      <p id="lead"></p>
      <p id="stats"></p>
      <p id="embers"></p>
      <div id="shop"></div>
      <button id="go">Mulai berlayar</button>
      <p class="keys">
        Geser mouse atau layar (mobile), atau A D / panah keyboard untuk
        mengarahkan. Spasi atau tombol Dash untuk melesat.
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
